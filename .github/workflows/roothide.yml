name: Build roothide Dopamine

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: Build scope
        required: true
        default: focused
        type: choice
        options:
          - focused
          - full
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_MODE: ${{ github.event.inputs.build_mode || 'focused' }}
  THEOS: ${{ github.workspace }}/theos
  THEOS_COMMIT: 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
  IOS_SDK_VERSION: "16.5"
  TRUSTCACHE_COMMIT: aa0e8847529cf76576fce8d2dbc9e088c8f1a0df

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Apply submodule patches
        run: |
          set -euo pipefail
          git -C BaseBin/XPF apply "$GITHUB_WORKSPACE/.github/patches/XPF-roothide.patch"
          git -C BaseBin/opainject apply --recount "$GITHUB_WORKSPACE/.github/patches/opainject-build.patch"
          git -C BaseBin/opainject apply --unidiff-zero "$GITHUB_WORKSPACE/.github/patches/opainject-serial-cleanup.patch"

      # Xcode 15.4 is the last toolchain used by the original Dopamine 3
      # project layout. Newer Xcodes treat some command-line targets as
      # macOS/Catalyst targets and fail to resolve their Swift packages.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.4"

      - name: Install Procursus tools
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid findutils sed coreutils

      - name: Install host dependencies
        run: |
          set -euo pipefail
          brew install make libarchive openssl@3 xz
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache Theos
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: ${{ env.THEOS }}
          key: theos-${{ runner.os }}-${{ runner.arch }}-${{ env.THEOS_COMMIT }}-sdk${{ env.IOS_SDK_VERSION }}

      - name: Install Theos and iOS SDK
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --recursive https://github.com/roothide/theos.git "$THEOS"
          git -C "$THEOS" checkout --detach "$THEOS_COMMIT"
          git -C "$THEOS" submodule update --init --recursive

          mkdir -p "$THEOS/sdks"
          sdk_archive="$RUNNER_TEMP/iPhoneOS${IOS_SDK_VERSION}.sdk.tar.xz"
          curl --fail --location --retry 3 \
            "https://github.com/theos/sdks/releases/latest/download/iPhoneOS${IOS_SDK_VERSION}.sdk.tar.xz" \
            --output "$sdk_archive"
          tar -xJf "$sdk_archive" -C "$THEOS/sdks"

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-xcode15.4-${{ hashFiles('**/Package.swift', '**/project.pbxproj') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-xcode15.4-

      - name: Build trustcache
        if: env.BUILD_MODE == 'full'
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/trustcache"
          git clone https://github.com/CRKatri/trustcache.git "$source_dir"
          git -C "$source_dir" checkout --detach "$TRUSTCACHE_COMMIT"

          openssl_prefix="$(brew --prefix openssl@3)"
          make -C "$source_dir" -j"$(sysctl -n hw.logicalcpu)" OPENSSL=1 \
            CFLAGS="-DOPENSSL -I${openssl_prefix}/include" \
            LDFLAGS="-L${openssl_prefix}/lib"
          make -C "$source_dir" install PREFIX="$HOME/.local"

      - name: Verify build environment
        run: |
          set -euo pipefail
          xcodebuild -version
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = "17.5"
          test -d "$THEOS/sdks/iPhoneOS${IOS_SDK_VERSION}.sdk"
          command -v make ldid
          make --version | head -n 1
          if [ "$BUILD_MODE" = full ]; then
            command -v trustcache
            file "$(command -v trustcache)"
          fi

      - name: Verify RootHide systemhook path contract
        run: |
          set -euo pipefail
          ! grep -R -n -E '^#define HOOK_DYLIB_PATH[[:space:]]+"/usr/lib/systemhook\.dylib"' \
            BaseBin/systemhook/src
          grep -F 'extern const char *HOOK_DYLIB_PATH;' \
            BaseBin/systemhook/src/common/common.h

      - name: Focused build systemhook
        if: env.BUILD_MODE == 'focused'
        run: |
          set -euo pipefail
          export CLANG_MODULE_CACHE_PATH="$RUNNER_TEMP/clang-module-cache"
          mkdir -p "$CLANG_MODULE_CACHE_PATH"
          make -C BaseBin systemhook
          mkdir -p artifacts
          cp BaseBin/systemhook/systemhook.dylib artifacts/systemhook.dylib
          file artifacts/systemhook.dylib
          strings artifacts/systemhook.dylib | grep -F "TRUSTFLOW-8A10"

      - name: Full build TIPA
        if: env.BUILD_MODE == 'full'
        run: |
          set -euo pipefail
          export CLANG_MODULE_CACHE_PATH="$RUNNER_TEMP/clang-module-cache"
          mkdir -p "$CLANG_MODULE_CACHE_PATH"
          make -j"$(sysctl -n hw.logicalcpu)" NIGHTLY=1

          version="$(cat BaseBin/_external/basebin/.version)-$(git rev-parse --short HEAD)"
          artifact="roothide-Dopamine-${version}.tipa"
          cp Application/Dopamine.tipa "Application/${artifact}"
          echo "artifact=${artifact}" >> "$GITHUB_ENV"

      - name: Upload focused artifact
        if: env.BUILD_MODE == 'focused'
        uses: actions/upload-artifact@v4
        with:
          name: roothide-systemhook-${{ github.sha }}
          path: artifacts/systemhook.dylib
          if-no-files-found: error
          retention-days: 14

      - name: Upload full artifact
        if: env.BUILD_MODE == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact }}
          path: Application/${{ env.artifact }}
          if-no-files-found: error
          retention-days: 14
